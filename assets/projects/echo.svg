<svg xmlns="http://www.w3.org/2000/svg" width="740" height="310" viewBox="0 0 740 310" role="img" aria-label="Echo: conversations becoming pages worth revisiting">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f3e9"/>
      <stop offset="1" stop-color="#e8ddd0"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0.9" y2="1">
      <stop stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f1e8db"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="1" dy="5" stdDeviation="6" flood-color="#806c5b" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="740" height="310" rx="18" fill="url(#paper)"/>
  <rect x="16" y="16" width="708" height="278" rx="10" fill="none" stroke="#a99988" opacity=".4" stroke-width="1.5"/>
  <path d="M392 32 V278" stroke="#b7a796" stroke-opacity=".28" stroke-dasharray="2 9"/>
  <g fill="#aa8178">
    <rect x="42" y="43" width="9" height="9" rx="2"/>
    <circle cx="378" cy="47" r="3"/>
    <circle cx="378" cy="263" r="3"/>
  </g>
  <text x="63" y="53" fill="#89786e" font-size="16" font-family="Verdana,DejaVu Sans,sans-serif" letter-spacing="2">PROJECT / 01</text>
  <text x="42" y="152" fill="#4a423e" font-size="71" font-weight="700" font-family="Georgia,DejaVu Serif,serif" letter-spacing="-3">Echo</text>
  <rect x="43" y="171" width="53" height="4" rx="2" fill="#b78378"/>
  <text x="42" y="213" fill="#746b63" font-size="21" font-family="Verdana,DejaVu Sans,sans-serif">From chats to keepsakes.</text>
  <text x="43" y="262" fill="#a08f82" font-size="12" font-family="Verdana,DejaVu Sans,sans-serif" letter-spacing="2">LOCAL  /  PERSONAL  /  REMEMBERED</text>

  <!-- Two lines of conversation, kept private and nameless -->
  <g opacity=".92">
    <rect x="415" y="103" width="92" height="35" rx="15" fill="#cbb4a5"/>
    <path d="M430 134 L422 143 L446 135" fill="#cbb4a5"/>
    <rect x="431" y="118" width="43" height="4" rx="2" fill="#fffaf3"/>
    <rect x="431" y="125" width="26" height="3" rx="1.5" fill="#f2e7db"/>
    <rect x="407" y="167" width="107" height="40" rx="15" fill="#d9dfd2"/>
    <path d="M498 199 L513 214 L487 203" fill="#d9dfd2"/>
    <rect x="423" y="181" width="67" height="4" rx="2" fill="#7c9487" opacity=".65"/>
    <rect x="423" y="189" width="47" height="4" rx="2" fill="#7c9487" opacity=".4"/>
  </g>

  <!-- The conversation settles into pages of a report, not a brand logo -->
  <g transform="rotate(-8 577 156)" filter="url(#shadow)">
    <rect x="499" y="58" width="178" height="213" rx="5" fill="#e5d7c7" stroke="#c9b8a6"/>
    <rect x="509" y="67" width="158" height="194" rx="3" fill="#f2e8db"/>
  </g>
  <g transform="rotate(6 597 156)" filter="url(#shadow)">
    <rect x="528" y="52" width="167" height="211" rx="5" fill="url(#sheet)" stroke="#ccbaaa"/>
    <path d="M672 52 L695 75 L672 75 Z" fill="#e8d8c7"/>
    <path d="M672 52 V75 H695" stroke="#ccbaaa" fill="none"/>
    <text x="549" y="83" fill="#a38d7e" font-size="10" font-family="Verdana,DejaVu Sans,sans-serif" letter-spacing="2">A CONVERSATION</text>
    <path d="M549 94 H669" stroke="#dacabc" stroke-width="1.5"/>
    <rect x="549" y="114" width="83" height="10" rx="5" fill="#dfc9bb"/>
    <rect x="549" y="131" width="104" height="6" rx="3" fill="#e5d7cc"/>
    <rect x="549" y="145" width="79" height="6" rx="3" fill="#e5d7cc"/>
    <rect x="567" y="168" width="101" height="10" rx="5" fill="#cedbd1"/>
    <rect x="587" y="185" width="81" height="6" rx="3" fill="#e5d7cc"/>
    <path d="M549 217 Q596 195 667 217" fill="none" stroke="#bd9e8e" stroke-width="1.7" opacity=".7"/>
    <path d="M549 225 H668" stroke="#ddd0c2" stroke-width="1.5"/>
    <text x="653" y="247" fill="#b1a196" font-size="10" font-family="Georgia,DejaVu Serif,serif">01</text>
  </g>

  <path d="M475 238 Q500 248 519 237" stroke="#b78378" stroke-width="2" opacity=".65" fill="none" stroke-linecap="round" stroke-dasharray="2 6"/>
  <g fill="#b78378" opacity=".85">
    <path d="M462 68 l2 7 7 2 -7 2 -2 7 -2 -7 -7 -2 7 -2z"/>
    <circle cx="712" cy="115" r="3"/>
    <circle cx="705" cy="127" r="2"/>
  </g>
</svg>